<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="auto" viewBox="0 0 1200 420"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0c16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#05070e"/></linearGradient><linearGradient id="primaryGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cyanGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".8"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="15"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".25" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes floatSlow{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes floatFast{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-14px) translateX(6px)}}@keyframes pulseOrb{0%{transform:scale(1);opacity:.25}50%{transform:scale(1.15);opacity:.45}}.floating-card-1{animation:floatSlow 6s ease-in-out infinite}.floating-card-2{animation:floatFast 7s ease-in-out infinite 1s}.pulsing-orb{animation:pulseOrb 8s ease-in-out infinite alternate;transform-origin:center}.circuit-line{stroke-dasharray:8 6;animation:dashAnim 25s linear infinite}.sub-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;letter-spacing:-.5px}.sub-text{font-weight:400}</style></defs><rect width="1200" height="420" fill="url(#bgGradient)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><circle cx